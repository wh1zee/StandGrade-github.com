<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram OSINT — Проверка юзернейма</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#0d1117; color:#e6edf3; min-height:100vh; }
  header { background:#161b22; padding:15px 30px; border-bottom:1px solid #30363d; }
  .logo { font-size:22px; font-weight:bold; color:#5865f2; }
  .container { max-width:900px; margin:30px auto; padding:0 20px; }
  .search-panel { background:#161b22; border-radius:12px; padding:30px; border:1px solid #30363d; }
  h2 { margin-bottom:15px; color:#f0883e; }
  p { color:#8b949e; margin-bottom:20px; }
  .input-row { display:flex; gap:10px; margin-bottom:20px; }
  input { flex:1; padding:14px; background:#0d1117; border:1px solid #30363d; border-radius:8px; color:#e6edf3; font-size:16px; }
  input:focus { outline:none; border-color:#5865f2; }
  button { background:#5865f2; color:white; border:none; padding:14px 30px; font-size:16px; border-radius:8px; cursor:pointer; font-weight:bold; transition:.2s; }
  button:hover { background:#4752c4; }
  button:disabled { background:#30363d; cursor:not-allowed; }
  .results { margin-top:25px; display:none; }
  .results.show { display:block; }
  .result-item { background:#21262d; padding:15px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid #30363d; flex-wrap:wrap; gap:10px; }
  .result-item.found { border-left-color:#3fb950; }
  .result-item.not-found { border-left-color:#da3633; }
  .result-item.checking { border-left-color:#f0883e; }
  .result-item a { color:#58a6ff; text-decoration:none; font-weight:bold; }
  .result-item a:hover { text-decoration:underline; }
  .status { font-size:13px; padding:4px 10px; border-radius:4px; }
  .status.found { background:#238636; color:white; }
  .status.not-found { background:#da3633; color:white; }
  .status.checking { background:#f0883e; color:#0d1117; }
  .summary { background:#161b22; border-radius:8px; padding:15px; margin-bottom:15px; border:1px solid #30363d; }
  .summary span { color:#3fb950; font-weight:bold; }
  .error { color:#da3633; margin-top:10px; }
</style>
</head>
<body>
<header>
  <div class="logo">🔍 Telegram OSINT</div>
</header>

<div class="container">
  <div class="search-panel">
    <h2>Проверка юзернейма</h2>
    <p>Введи юзернейм без @ — скрипт проверит, где он встречается в открытых источниках.</p>
    <div class="input-row">
      <input type="text" id="usernameInput" placeholder="например: username" autocomplete="off">
      <button id="searchBtn" onclick="startSearch()">Проверить</button>
    </div>
    <div class="error" id="errorMsg"></div>
    <div class="results" id="results">
      <div class="summary" id="summary"></div>
      <div id="resultsList"></div>
    </div>
  </div>
</div>

<script>
var SITES = [
  { name: "Telegram", url: "https://t.me/", check: true },
  { name: "GitHub", url: "https://github.com/", check: true },
  { name: "Instagram", url: "https://instagram.com/", check: true },
  { name: "TikTok", url: "https://tiktok.com/@", check: true },
  { name: "Twitter (X)", url: "https://twitter.com/", check: true },
  { name: "VK", url: "https://vk.com/", check: true },
  { name: "YouTube", url: "https://youtube.com/@", check: true },
  { name: "Reddit", url: "https://reddit.com/user/", check: true },
  { name: "Pinterest", url: "https://pinterest.com/", check: true },
  { name: "Twitch", url: "https://twitch.tv/", check: true },
  { name: "Steam", url: "https://steamcommunity.com/id/", check: true },
  { name: "Facebook", url: "https://facebook.com/", check: true },
  { name: "Teletype", url: "https://teletype.in/@", check: true },
  { name: "Medium", url: "https://medium.com/@", check: true },
  { name: "Habr", url: "https://habr.com/ru/users/", check: true },
  { name: "SoundCloud", url: "https://soundcloud.com/", check: true },
  { name: "Spotify", url: "https://open.spotify.com/user/", check: true },
  { name: "Patreon", url: "https://patreon.com/", check: true },
  { name: "Behance", url: "https://behance.net/", check: true },
  { name: "Dribbble", url: "https://dribbble.com/", check: true }
];

var checking = false;

function clearResults() {
  document.getElementById('resultsList').innerHTML = '';
  document.getElementById('summary').innerHTML = '';
  document.getElementById('errorMsg').textContent = '';
}

function startSearch() {
  if (checking) return;
  var raw = document.getElementById('usernameInput').value.trim();
  if (!raw) {
    document.getElementById('errorMsg').textContent = 'Введи юзернейм';
    return;
  }
  var username = raw.replace('@', '').toLowerCase();
  if (!/^[a-z0-9_]{3,32}$/.test(username)) {
    document.getElementById('errorMsg').textContent = 'Юзернейм может содержать только a-z, 0-9 и _ (3-32 символа)';
    return;
  }

  checking = true;
  document.getElementById('searchBtn').disabled = true;
  document.getElementById('searchBtn').textContent = 'Проверяю...';
  clearResults();
  document.getElementById('results').classList.add('show');

  var found = 0;
  var checked = 0;
  var total = SITES.length;

  SITES.forEach(function(site) {
    var item = document.createElement('div');
    item.className = 'result-item checking';
    item.id = 'site-' + site.name.replace(/[^a-z0-9]/gi, '');
    item.innerHTML = '<span>' + site.name + '</span><span class="status checking">проверка...</span>';
    document.getElementById('resultsList').appendChild(item);
  });

  SITES.forEach(function(site) {
    var fullUrl = site.url + username;
    checkUrl(fullUrl, function(ok) {
      checked++;
      var el = document.getElementById('site-' + site.name.replace(/[^a-z0-9]/gi, ''));
      if (ok) {
        found++;
        el.className = 'result-item found';
        el.innerHTML = '<span>' + site.name + '</span><a href="' + fullUrl + '" target="_blank" rel="noopener">' + fullUrl + '</a><span class="status found">найден</span>';
      } else {
        el.className = 'result-item not-found';
        el.innerHTML = '<span>' + site.name + '</span><span style="color:#8b949e">' + fullUrl + '</span><span class="status not-found">не найден</span>';
      }

      if (checked === total) {
        checking = false;
        document.getElementById('searchBtn').disabled = false;
        document.getElementById('searchBtn').textContent = 'Проверить';
        document.getElementById('summary').innerHTML = 'Найдено <span>' + found + '</span> из ' + total + ' площадок по юзернейму <b>' + username + '</b>';
      }
    });
  });
}

function checkUrl(url, callback) {
  var img = new Image();
  var timeout = setTimeout(function() {
    img.onload = null;
    img.onerror = null;
    callback(false);
  }, 5000);

  img.onload = function() {
    clearTimeout(timeout);
    callback(true);
  };
  img.onerror = function() {
    clearTimeout(timeout);
    callback(false);
  };

  var faviconUrl = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(url) + '&sz=64';
  img.src = faviconUrl;
}

document.getElementById('usernameInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') startSearch();
});
</script>
</body>
</html>
